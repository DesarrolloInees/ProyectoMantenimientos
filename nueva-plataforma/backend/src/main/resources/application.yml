server:
  port: ${PUERTO:8081}
  compression:
    enabled: true

spring:
  application:
    name: plataforma-inees
  datasource:
    url: ${DB_URL:jdbc:mariadb://localhost:3306/inees_plataforma}
    username: ${DB_USUARIO:root}
    password: ${DB_CLAVE:}
  flyway:
    # La base actual ya tiene las 42 tablas: Flyway la toma como versión 1 y aplica desde la V2.
    baseline-on-migrate: true
    baseline-version: 1
    baseline-description: Esquema base de la aplicacion PHP
  mvc:
    format:
      date: iso
      time: iso
      date-time: iso
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 60MB
  # Correo (recuperación de contraseña y alertas logísticas). Sin SMTP_HOST no se envía nada.
  mail:
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:465}
    username: ${SMTP_USER:}
    password: ${SMTP_PASS:}
    properties:
      mail.smtp.auth: true
      mail.smtp.ssl.enable: ${SMTP_SSL:true}
      mail.smtp.starttls.enable: ${SMTP_STARTTLS:false}
      mail.smtp.connectiontimeout: 10000
      mail.smtp.timeout: 15000

app:
  zona-horaria: America/Bogota
  jwt:
    # En producción se define JWT_SECRETO con al menos 32 caracteres.
    secreto: ${JWT_SECRETO:solo-desarrollo-cambiar-este-secreto-de-32-caracteres-o-mas}
    horas-validez: 12
  almacenamiento:
    # Carpeta donde se guardan fotos y firmas. Las rutas se guardan como uploads/...
    # (el mismo prefijo de la aplicación PHP): apuntarla a su carpeta app/ para conservar las fotos históricas.
    ruta: ${ALMACENAMIENTO_RUTA:../almacenamiento}
    lado-maximo-px: 1280
  cors-origenes: ${CORS_ORIGENES:http://localhost:4310}
  correo:
    remitente: ${SMTP_REMITENTE:${SMTP_USER:}}
    nombre-remitente: INEES Mantenimientos
  telegram:
    token: ${TELEGRAM_TOKEN:}
    chat-id: ${TELEGRAM_CHAT_ID:}
  ia:
    url: https://api.groq.com/openai/v1/chat/completions
    claves: ${GROQ_API_KEY:},${GROQ_API_KEY_2:}
    modelos: openai/gpt-oss-20b,qwen/qwen3.8-27b
  google:
    clave-geocodificacion: ${GOOGLE_GEOCODING_KEY:}
  # Distancias por carretera para las rutas (servidor OSRM propio, ver nueva-plataforma/osrm/README.md).
  # Vacío = línea recta × factor_ruta_vial, como antes.
  osrm:
    url: ${OSRM_URL:}
    max-tabla: ${OSRM_MAX_TABLA:100}

logging:
  level:
    org.flywaydb: info
    com.openhtmltopdf: warn
