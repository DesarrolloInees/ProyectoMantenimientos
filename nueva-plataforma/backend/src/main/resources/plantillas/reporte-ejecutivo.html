<!DOCTYPE html>
<html lang="es">
<!-- Port de app/views/reportes/reporteEjecutivoGenerar.php. Chrome ejecuta el script antes de imprimir. -->
<head>
    <meta charset="UTF-8">
    <title>Reporte Ejecutivo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; zoom: 0.8; }
        @page {
            size: A4 landscape; margin: 10mm 10mm 15mm 10mm;
            @bottom-left { content: "DOCUMENTO CONFIDENCIAL"; font-family: sans-serif; font-size: 9px; font-weight: bold; letter-spacing: 2px; color: #94a3b8; border-top: 1px solid #e2e8f0; }
            @bottom-center { content: "PIE_PERIODO"; font-family: sans-serif; font-size: 9px; font-weight: bold; color: #64748b; border-top: 1px solid #e2e8f0; }
            @bottom-right { content: "Página " counter(page); font-family: sans-serif; font-size: 9px; font-weight: bold; color: #475569; border-top: 1px solid #e2e8f0; }
        }
        .page-break { page-break-after: always; break-after: page; }
        .card-wrapper { page-break-after: always; break-after: page; display: block; width: 100%; min-height: 130mm; box-sizing: border-box; margin-bottom: 2rem; }
        .card-wrapper:last-child { page-break-after: auto !important; break-after: auto !important; margin-bottom: 0; }
        .card { background-color: white; border-radius: 16px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05); border: 1px solid #f3f4f6; width: 100%; min-height: 130mm; box-sizing: border-box; padding: 32px; zoom: 1.3; }
        .modo-unico-activo .card-wrapper { page-break-after: auto !important; break-after: auto !important; }
        .modo-unico-activo .card { zoom: 1.6; }
        .portada-container { min-height: 190mm; height: 190mm; background-color: #ffffff; color: #1e293b; position: relative; border-top: 12px solid #3b82f6; border-bottom: 12px solid #334155; display: flex; justify-content: center; }
        .bg-pattern { display: none; }
        .date-badge { font-size: 9px; color: #94a3b8; background-color: #f8fafc; border: 1px solid #f1f5f9; padding: 2px 8px; border-radius: 6px; font-family: 'Courier New', Courier, monospace; white-space: nowrap; }
        .seccion-reporte { page-break-before: always; break-before: page; }
        .seccion-reporte:first-child, .portada-container + .seccion-reporte { page-break-before: avoid; break-before: auto; }
    </style>
</head>
<body class="p-8 text-slate-800">
<div id="raiz"></div>
<script>
const D = /*DATOS*/null;

// ---------------------------------------------------------------- helpers (equivalentes PHP)
const e = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' })[c]);
const num = (v) => Number(v) || 0;
function phpRound(v, d = 0) { const p = Math.pow(10, d); const x = num(v) * p; return (x < 0 ? -Math.round(-x) : Math.round(x)) / p; }
function nf(v, dec = 0, sd = '.', st = ',') {
    const r = phpRound(v, dec);
    const neg = r < 0;
    const [ent, fr] = Math.abs(r).toFixed(dec).split('.');
    const g = ent.replace(/\B(?=(\d{3})+(?!\d))/g, st);
    return (neg ? '-' : '') + g + (dec > 0 ? sd + fr : '');
}
const nfCO = (v) => nf(v, 0, ',', '.');
function dmy(f) { const s = String(f || '').substring(0, 10).split('-'); return s.length === 3 ? `${s[2]}/${s[1]}/${s[0]}` : ''; }
const activa = (s) => (D.secciones || []).includes(s);
const sum = (arr, k) => arr.reduce((a, x) => a + num(x[k]), 0);
const rango = `${dmy(D.inicio)} - ${dmy(D.fin)}`;
const rangoRaya = `${dmy(D.inicio)} — ${dmy(D.fin)}`;

let h = '';

// ---------------------------------------------------------------- PORTADA
if (activa('portada')) {
    const cm = num(D.cumplimientoMeta);
    const kd = D.kpisDelegacion || [];
    h += `
    <div class="portada-container w-full rounded-none flex flex-col items-center justify-between py-12 relative mb-8 card-wrapper" style="min-height: 190mm; height: auto;">
        <div class="z-10 text-center flex-shrink-0 mb-8">
            <div class="mb-6 flex justify-center"><img src="${D.logo}" class="h-20 object-contain  opacity-80" alt="Logo Empresa"></div>
            <h1 class="text-6xl font-black text-green-600 mb-2 tracking-tight leading-none">REPORTE<br><span class="text-blue-600">EJECUTIVO</span></h1>
            <div class="w-24 h-2 bg-blue-600 mx-auto my-6 rounded-full"></div>
            <div class="mt-2 inline-block bg-slate-50 border border-slate-200 px-8 py-3 rounded-full">
                <span class="text-lg font-mono font-bold text-slate-600">📅 ${dmy(D.inicio)} — ${dmy(D.fin)}</span>
            </div>
        </div>
        <div class="w-full px-8 mb-4 flex-1 flex items-end">
            <div class="grid grid-cols-3 gap-4 w-full">
                <div class="bg-emerald-50 border border-emerald-200 p-4 rounded-xl shadow-sm">
                    <div class="text-[10px] uppercase font-bold text-emerald-700 tracking-wide">Servicios Esperados (Meta)</div>
                    <div class="text-3xl font-black text-emerald-700 mt-1">${nf(D.metaServicios.esperados)}</div>
                    <div class="text-[9px] text-emerald-600/80 mt-1">${nf(D.metaServicios.dias_laborables)} días laborables</div>
                </div>
                <div class="bg-blue-50 border border-blue-200 p-4 rounded-xl shadow-sm">
                    <div class="text-[10px] uppercase font-bold text-blue-700 tracking-wide">Servicios Realizados</div>
                    <div class="flex items-baseline gap-2 mt-1">
                        <div class="text-3xl font-black text-blue-700">${nf(D.totalGlobalServicios)}</div>
                        <span class="text-[10px] font-bold text-rose-600 bg-rose-50 border border-rose-200 px-2 py-0.5 rounded-full whitespace-nowrap">${nf(D.totalServiciosFallidos)} fallidos</span>
                    </div>
                    <div class="text-[9px] text-blue-600/80 mt-1">Total de servicios registrados en el período</div>
                </div>
                <div class="bg-white border border-slate-200 p-4 rounded-xl shadow-sm">
                    <div class="text-[10px] uppercase font-bold text-slate-500 tracking-wide">Cumplimiento de Meta</div>
                    <div class="text-3xl font-black mt-1 ${cm >= 100 ? 'text-emerald-600' : cm >= 80 ? 'text-amber-600' : 'text-rose-600'}">${nf(cm, 1)}%</div>
                    <div class="text-[9px] text-slate-400 mt-1">Realizados / Esperados del período</div>
                </div>
            </div>
        </div>
        <div class="w-full px-8 mb-4 flex-1 flex items-end">
            <div class="grid grid-cols-4 gap-4 w-full items-stretch">
                <div class="bg-white border border-slate-200 p-4 rounded-xl text-left flex flex-col shadow-sm min-h-[12rem]">
                    <div class="flex justify-between items-start border-b border-slate-100 pb-2 mb-2">
                        <div class="text-xs uppercase font-bold text-slate-400">Total Servicios</div>
                        <div class="flex items-baseline gap-2">
                            <div class="text-3xl font-black text-blue-600">${nf(D.totalGlobalServicios)}</div>
                            <span class="text-[9px] font-bold text-rose-600 bg-rose-50 border border-rose-200 px-1.5 py-0.5 rounded-full whitespace-nowrap">${nf(D.totalServiciosFallidos)} fallidos</span>
                        </div>
                    </div>
                    <div class="space-y-1.5 text-[10px] flex-1">
                        ${kd.map((k) => `<div class="flex items-center justify-between border-b border-slate-50 last:border-0 py-1">
                            <span class="truncate w-16 text-slate-600 font-medium">${e(k.delegacion)}</span>
                            <div class="flex items-center gap-2"><span class="font-bold text-slate-800">${k.total}</span><span class="text-[9px] text-slate-400 w-8 text-right">${k.porcentaje}%</span></div>
                        </div>`).join('')}
                    </div>
                </div>
                <div class="bg-white border border-slate-200 p-4 rounded-xl text-left flex flex-col shadow-sm min-h-[12rem]">
                    <div class="text-xs uppercase font-bold text-slate-400 mb-2 border-b border-slate-100 pb-2">Promedio / Téc. <span class="normal-case opacity-50">(Diario)</span></div>
                    <div class="space-y-1.5 text-[10px] flex-1">
                        ${kd.map((k) => `<div class="flex justify-between items-center py-1 border-b border-slate-50 last:border-0">
                            <span class="text-slate-600">${e(k.delegacion)}</span>
                            <div class="flex items-center gap-2">
                                <div class="w-10 h-1.5 bg-slate-100 rounded-full overflow-hidden"><div class="h-full bg-emerald-500" style="width: ${(num(k.promedio_diario) / 8) * 100}%"></div></div>
                                <span class="font-bold text-emerald-600 w-6 text-right">${k.promedio_diario}</span>
                            </div>
                        </div>`).join('')}
                    </div>
                </div>
                <div class="bg-white border border-slate-200 p-4 rounded-xl text-left flex flex-col shadow-sm min-h-[12rem]">
                    <div class="flex justify-between items-start border-b border-slate-100 pb-2 mb-2">
                        <div class="text-xs uppercase font-bold text-slate-400">Novedades</div>
                        <div class="text-3xl font-black text-red-500">${nf(D.datosNovedad?.con_novedad)}</div>
                    </div>
                    <div class="space-y-1.5 text-[10px] flex-1">
                        ${kd.map((k) => `<div class="flex justify-between items-center py-1 border-b border-slate-50 last:border-0">
                            <span class="text-slate-600">${e(k.delegacion)}</span>
                            <span class="font-bold ${num(k.novedades) > 0 ? 'text-red-500' : 'text-slate-300'}">${k.novedades}</span>
                        </div>`).join('')}
                    </div>
                </div>
                <div class="bg-white border border-slate-200 p-4 rounded-xl text-left flex flex-col shadow-sm min-h-[12rem]">
                    <div class="text-xs uppercase font-bold text-slate-400 mb-3 border-b border-slate-100 pb-2">Delegaciones</div>
                    <div class="flex flex-wrap gap-2 content-start">
                        ${kd.map((k) => `<span class="bg-slate-50 border border-slate-200 text-slate-600 px-2 py-1 rounded text-[9px] font-medium">${e(k.delegacion)}</span>`).join('')}
                    </div>
                </div>
            </div>
        </div>
    </div>`;
}

h += '<div class="flex flex-col w-full">';

const encabezado = (icono, claseIcono, titulo, sub, claseTitulo = 'text-sm font-bold text-slate-800 leading-tight', claseSub = 'text-[9px] text-slate-400', claseFecha = 'text-[10px] font-bold text-slate-700 px-2.5 py-1.5', claseCont = 'flex justify-between items-center mb-4 border-b border-gray-100 pb-2.5 shrink-0') => `
    <div class="${claseCont}">
        <div class="flex items-center gap-2.5">
            <div class="${claseIcono}">${icono}</div>
            <div><h3 class="${claseTitulo}">${titulo}</h3><p class="${claseSub}">${sub}</p></div>
        </div>
        <div class="date-badge ${claseFecha}">${rango}</div>
    </div>`;

// ---------------------------------------------------------------- DELEGACIONES
if (activa('delegaciones')) {
    const kd = D.kpisDelegacion || [];
    const maxValor = kd.length ? Math.max(...kd.map((k) => num(k.total))) : 1;
    h += `
    <div class="card-wrapper mt-4"><div class="card p-3">
        <div class="flex justify-between items-start mb-2">
            <div class="flex items-center gap-2">
                <div class="w-8 h-8 rounded-full bg-indigo-50 flex items-center justify-center text-indigo-600 text-lg">📊</div>
                <div><h3 class="text-sm font-bold text-slate-800 leading-tight">Participación por Delegación</h3><p class="text-[9px] text-slate-400">Volumen, % Global y Fuerza Técnica</p></div>
            </div>
            <div class="date-badge text-lg font-bold text-slate-700">${rango}</div>
        </div>
        <div class="relative h-96 w-full pl-8 pr-2 pt-6 pb-12 border-l border-b border-slate-200 mx-auto">
            <div class="absolute inset-0 pl-8 pointer-events-none flex flex-col justify-between opacity-10">
                ${'<div class="w-full border-t border-slate-400 border-dashed h-0"></div>'.repeat(3)}<div class="w-full h-0"></div>
            </div>
            <div class="absolute left-0 top-0 h-full flex flex-col justify-between text-[8px] text-slate-300 font-bold pr-2 pb-12 pt-6"><span>MAX</span><span>0</span></div>
            <div class="flex items-end justify-around h-full w-full gap-2 relative z-10">
                ${kd.map((k) => {
                    const alto = (num(k.total) / (maxValor || 1)) * 100;
                    const dest = num(k.porcentaje) > 20;
                    return `<div class="flex flex-col items-center justify-end h-full flex-1 group max-w-[35px]">
                        <div class="mb-1 text-[9px] ${dest ? 'text-indigo-700 font-bold' : 'text-slate-500'}">${k.total}</div>
                        <div class="${dest ? 'bg-indigo-600' : 'bg-indigo-400'} w-full rounded-t-sm shadow-sm transition-all duration-700" style="height: ${alto}%;"></div>
                        <div class="absolute -bottom-10 flex flex-col items-center w-full">
                            <div class="text-[7px] font-bold text-slate-600 uppercase truncate w-full text-center">${e(String(k.delegacion ?? '').substring(0, 8))}</div>
                            <div class="text-[8px] font-bold text-indigo-600 bg-indigo-50 px-1 rounded-sm mt-0.5 border border-indigo-100">${k.porcentaje}%</div>
                            <div class="flex items-center gap-0.5 mt-0.5 text-[7px] text-slate-400" title="Técnicos Activos"><span>👷</span> ${k.num_tecnicos ?? 0}</div>
                        </div>
                    </div>`;
                }).join('')}
            </div>
        </div>
        <div class="mt-4 flex justify-between items-center text-[8px] text-slate-400 bg-slate-50/50 p-1.5 rounded-lg border border-slate-100">
            <div class="flex gap-3">
                <div class="flex items-center gap-1"><span class="w-2 h-2 bg-indigo-600 rounded-xs"></span> &gt; 20% Part.</div>
                <div class="flex items-center gap-1">👷 Técnicos Activos</div>
            </div>
            <div class="flex flex-col"><span class="text-sm uppercase tracking-wide text-slate-500 font-semibold">Total Global</span><strong class="text-xl text-slate-800 tracking-tight">${nf(D.totalGlobalServicios)}</strong></div>
        </div>
    </div></div>`;
}

// ---------------------------------------------------------------- TENDENCIAS
if (activa('tendencias')) {
    const sem = D.semanasGroup || [];
    let maxVal = 1;
    sem.forEach((s) => s.dias.forEach((d) => (maxVal = Math.max(maxVal, num(d.total)))));
    h += `
    <div class="card-wrapper w-full h-fit" style="break-after: page !important; page-break-after: always !important;">
        <div class="card p-5 flex flex-col justify-between">
            <div class="flex justify-between items-start mb-4 border-b border-gray-100 pb-3 shrink-0">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 rounded-full bg-blue-50 flex items-center justify-center text-blue-600 text-xl">📅</div>
                    <div><h3 class="text-lg font-bold text-slate-800 leading-tight">Evolución Diaria de Servicios</h3><p class="text-[10px] text-slate-400">Detalle por semanas operativas del período</p></div>
                </div>
                <div class="date-badge text-xs font-bold text-slate-700 px-3 py-1.5">${rango}</div>
            </div>
            <div class="grid grid-cols-2 gap-4 text-xs flex-1">
                ${sem.map((s) => `<div class="bg-slate-50 border border-slate-200 rounded-xl p-3 shadow-sm flex flex-col justify-between h-fit break-inside-avoid">
                    <h4 class="font-bold text-blue-600 uppercase mb-2 border-b border-blue-100 pb-1 text-[10px] tracking-wider shrink-0">${e(s.nombre)}</h4>
                    <div class="space-y-1.5 flex-1 flex flex-col justify-center">
                        ${s.dias.map((d) => `<div class="flex items-center gap-2">
                            <div class="w-9 font-bold text-slate-600 leading-none text-[10px]">${d.dia_nombre}<div class="text-[8px] font-normal text-slate-400 mt-0.5">${String(d.fecha).substring(8, 10)}</div></div>
                            <div class="flex-1 h-2.5 bg-white rounded-full overflow-hidden border border-slate-200 shadow-inner"><div class="h-full bg-gradient-to-r from-blue-400 to-blue-500 rounded-full" style="width: ${(num(d.total) / maxVal) * 100}%"></div></div>
                            <div class="w-5 text-right font-black text-slate-700 text-[10px]">${d.total}</div>
                            <div class="flex items-center gap-0.5 text-[9px] text-slate-500 bg-slate-200/50 px-1 py-0.5 rounded" title="Técnicos trabajando"><span>👷</span><span class="font-bold">${d.num_tecnicos ?? 0}</span></div>
                        </div>`).join('')}
                    </div>
                </div>`).join('')}
            </div>
            <div class="mt-4 flex justify-end items-center text-[10px] text-slate-500 bg-blue-50/50 px-3 py-1.5 rounded-lg border border-blue-100 shrink-0">
                <div class="flex items-center gap-1 font-medium"><span>👷</span> = Cantidad de técnicos activos operando ese día</div>
            </div>
        </div>
    </div>`;
}

// ---------------------------------------------------------------- MANTENIMIENTO
if (activa('mantenimiento')) {
    const tipos = (D.todosTiposMant || []).map((t) => t.nombre_completo);
    const mm = D.matrizMant || {};
    const totCol = {};
    tipos.forEach((t) => (totCol[t] = 0));
    let gran = 0;
    const filas = (D.delegacionesListaMant || []).map((del) => {
        let rowTotal = 0;
        tipos.forEach((t) => (rowTotal += num(mm[del]?.[t])));
        const celdas = tipos.map((t) => {
            const val = num(mm[del]?.[t]);
            totCol[t] += val;
            const pct = rowTotal > 0 ? phpRound((val / rowTotal) * 100, 1) : 0;
            if (val == 0) return `<td class="px-1 py-0.5 align-middle text-slate-200">-</td>`;
            const bg = pct > 50 ? 'bg-purple-100 text-purple-900' : 'bg-purple-50 text-purple-700';
            return `<td class="px-1 py-0.5 align-middle font-black ${bg}"><div class='text-[9px] leading-tight'>${val}</div><div class='text-[7px] font-normal opacity-70 leading-none'>${pct}%</div></td>`;
        }).join('');
        gran += rowTotal;
        return `<tr class="hover:bg-slate-50">
            <td class="px-2.5 py-0.5 text-left font-bold text-slate-700 bg-slate-50/50 text-[9px] border-r border-slate-100"><div class="truncate hover:text-clip hover:whitespace-normal transition-all duration-200" title="${e(del)}">${e(del)}</div></td>
            ${celdas}
            <td class="px-2.5 py-0.5 font-bold bg-slate-100 text-slate-800 text-[9px]">${rowTotal}</td>
        </tr>`;
    }).join('');
    h += `
    <div class="card-wrapper w-full" style="page-break-before: always !important; break-before: page !important; margin-top: 0 !important; align-self: flex-start !important;">
        <div class="card py-3 px-4 flex flex-col justify-between">
            <div class="flex justify-between items-start mb-2 border-b border-gray-100 pb-2 shrink-0">
                <div class="flex items-center gap-2.5">
                    <div class="w-8 h-8 rounded-full bg-purple-50 flex items-center justify-center text-purple-600 text-base">🔧</div>
                    <div><h3 class="text-sm font-bold text-slate-800 leading-tight">Servicios por Tipo de Mantenimiento</h3><p class="text-[9px] text-slate-400 leading-none">Distribución de cantidades y porcentajes por delegación</p></div>
                </div>
                <div class="date-badge text-[9px] font-bold text-slate-700 px-2 py-1">${rango}</div>
            </div>
            <div class="overflow-hidden rounded-md border border-slate-200">
                <table class="w-full text-[9px] text-center border-collapse">
                    <thead class="bg-slate-50 text-slate-500 font-semibold uppercase tracking-wider shrink-0">
                        <tr>
                            <th class="px-2 py-1 text-left bg-slate-100 border-b border-slate-200 text-[9px] w-36">Delegación</th>
                            ${tipos.map((t) => `<th class="px-1 py-1 border-b border-slate-200 align-bottom"><div class="text-[8px] leading-tight break-words w-14 mx-auto text-slate-500">${e(t)}</div></th>`).join('')}
                            <th class="px-2 py-1 border-b border-slate-200 bg-slate-50 font-bold text-slate-700 text-[9px]">Total</th>
                        </tr>
                    </thead>
                    <tbody class="divide-y divide-slate-100">${filas}</tbody>
                    <tfoot class="bg-slate-100 font-bold text-slate-800 border-t border-slate-200 shrink-0">
                        <tr class="text-[9px]">
                            <td class="px-2.5 py-1 text-left font-bold">TOTAL</td>
                            ${tipos.map((t) => `<td class="px-1 py-1"><div class="text-slate-800 text-[9px]">${totCol[t]}</div><div class="text-[7px] text-purple-600 font-normal leading-none">${gran > 0 ? phpRound((totCol[t] / gran) * 100, 1) : 0}%</div></td>`).join('')}
                            <td class="px-2.5 py-1 bg-slate-200 text-purple-900 font-black text-xs">${gran}</td>
                        </tr>
                    </tfoot>
                </table>
            </div>
        </div>
    </div>`;
}

// ---------------------------------------------------------------- MÁQUINAS
const tiposMaq = (D.tiposMaquinaCols || []).map((t) => t.nombre_tipo_maquina);
if (activa('maquinas')) {
    const mq = D.matrizMaquina || {};
    const totCol = {};
    tiposMaq.forEach((t) => (totCol[t] = 0));
    let gran = 0;
    const filas = (D.delegacionesListaMaquina || []).map((del) => {
        let rowT = 0;
        const celdas = tiposMaq.map((t) => {
            const val = num(mq[del]?.[t]);
            rowT += val;
            totCol[t] += val;
            const cls = val == 0 ? 'text-slate-200 font-normal' : 'text-teal-800 font-black bg-teal-50';
            return `<td class="px-1 py-1.5 align-middle border-r border-slate-100/50 last:border-r-0 text-xs ${cls}">${val == 0 ? '-' : val}</td>`;
        }).join('');
        gran += rowT;
        return `<tr class="hover:bg-slate-50/80 transition-colors">
            <td class="px-3 py-1.5 text-left font-bold text-slate-700 bg-slate-50/50 text-xs border-r border-slate-100"><div class="truncate max-w-[150px]" title="${e(del)}">${e(del)}</div></td>
            ${celdas}
            <td class="px-3 py-1.5 font-extrabold bg-slate-100/50 text-slate-800 text-xs">${rowT}</td>
        </tr>`;
    }).join('');
    h += `
    <div class="card-wrapper"><div class="card p-6 flex flex-col justify-between">

                            </tr>`).join('') + `<tr class="bg-orange-50 border-t border-orange-100"><td colspan="2" class="text-right py-1 font-bold text-orange-700 text-[7px]">SUBTOTAL:</td><td class="text-right py-1 pr-0.5 font-black text-orange-800 text-[7px]">$${nf(totGral)}</td></tr>`
                            : `<tr><td colspan="2" class="text-center py-4 text-gray-300">Sin registros</td></tr>`}
                        </tbody>
                    </table>
                </div>
                <div class="bg-orange-50 border-t border-orange-100 px-3 py-1.5 flex justify-between items-center shrink-0"><span class="font-bold text-orange-700 text-[9px]">SUBTOTAL:</span><span class="font-black text-orange-800 text-[10px]">$${nf(totGral)}</span></div>
            </div>
        </div>
        <div class="bg-slate-800 rounded-xl shadow border border-slate-700 py-2.5 px-4 text-white flex justify-between items-center mt-4 shrink-0">
            <div class="text-left"><p class="text-[8px] font-bold text-slate-300 uppercase tracking-widest leading-none">Total Egresos Operativos</p><p class="text-[8px] text-slate-400 leading-none mt-1">(Motorizados + Nómina Administrativa + Gastos Administrativos)</p></div>
            <h2 class="text-base font-black text-white leading-none">$${nfCO(granTotal)}</h2>
        </div>
    </div></div>`;
}

if (activa('balance')) {
    const tarjeta = (c, titulo, v, pct, cant) => `
        <div class="bg-${c}-50 border border-${c}-100 rounded p-1 flex flex-col justify-between text-center">
            <div>
                <div class="text-[6px] uppercase font-bold text-${c}-600 mb-0.5">${titulo}</div>
                <div class="text-[9px] font-black text-slate-700 leading-tight">$${nfCO(v)}</div>
                <div class="w-full bg-${c}-200 h-0.5 mt-0.5 rounded-full overflow-hidden"><div style="width: ${pct}%" class="h-full bg-${c}-500"></div></div>
            </div>
            <div class="flex justify-between items-center w-full mt-1 px-0.5">
                <span class="text-[6px] font-bold text-${c}-700 bg-${c}-100 px-0.5 rounded">${cant === null ? '-' : cant + ' Serv.'}</span>
                <span class="text-[6px] font-bold text-${c}-500">${phpRound(pct, 1)}%</span>
            </div>
        </div>`;
    const costo = (c, titulo, v, pct) => `
        <div class="bg-white border border-${c}-100 shadow-sm rounded p-1.5 flex flex-col justify-between relative overflow-hidden">
            <div class="absolute top-0 right-0 w-8 h-8 bg-${c}-50 rounded-bl-full -mr-2 -mt-2 z-0"></div>
            <div class="relative z-10"><div class="text-[6px] uppercase font-bold text-${c}-600 mb-0.5">${titulo}</div><div class="text-xs font-black text-slate-700">$${nfCO(v)}</div></div>
            <div class="flex items-center gap-1 mt-1 relative z-10">
                <div class="flex-1 bg-gray-100 h-1 rounded-full overflow-hidden"><div style="width: ${pct}%" class="h-full bg-${c}-500"></div></div>
                <div class="text-[7px] font-bold text-${c}-600">${phpRound(pct, 1)}%</div>
            </div>
        </div>`;
    h += `
    <div class="card-wrapper"><div class="card p-4 flex flex-col justify-between">
        <div class="bg-slate-800 px-3 py-2 flex justify-between items-center text-white rounded-t-xl">
            <div class="flex items-center gap-2">
                <div class="bg-slate-700 p-1 rounded-md text-base">💰</div>
                <div><h3 class="font-bold text-sm uppercase tracking-wide text-emerald-400">Estado de Resultados</h3><p class="text-[8px] text-slate-400">Vista detallada por Columnas</p></div>
            </div>
            <div class="text-right">
                <div class="text-[7px] uppercase tracking-widest text-slate-400">VALOR TOTAL DESPUES DE LA RESTA DE LOS COSTOS</div>
                <div class="text-xl font-black ${utilidad >= 0 ? 'text-emerald-400' : 'text-rose-400'}">$ ${nfCO(utilidad)}</div>
            </div>
        </div>
        <div class="p-3">
            <div class="flex flex-col gap-3 mt-2">
                <div class="w-full">
                    <div class="flex justify-between items-end mb-1 border-b border-emerald-100 pb-0.5">
                        <h4 class="font-bold text-emerald-700 uppercase text-[8px] flex items-center gap-1"><span class="text-xs">💰</span> Desglose de Ingresos</h4>
                        <span class="font-black text-emerald-800 text-xs">$ ${nf(totIng)}</span>
                    </div>
                    <div class="grid grid-cols-6 gap-1">
                        ${tarjeta('emerald', 'Preventivo', vPrev, pI(vPrev), num(I.cant_prev))}
                        ${tarjeta('teal', 'Profundo', vProf, pI(vProf), num(I.cant_prof))}
                        ${tarjeta('blue', 'Correctivo', vCorr, pI(vCorr), num(I.cant_corr))}
                        ${tarjeta('orange', 'Fallido', vFall, pI(vFall), num(I.cant_fall))}
                        ${tarjeta('rose', 'Garantía', vGar, pI(vGar), num(I.cant_garan))}
                        ${tarjeta('violet', 'Repuestos', vRep, pI(vRep), null)}
                    </div>
                </div>
                <div class="w-full">
                    <div class="flex justify-between items-end mb-1 border-b border-rose-100 pb-0.5">
                        <h4 class="font-bold text-rose-700 uppercase text-[8px] flex items-center gap-1"><span class="text-xs">📉</span> Desglose de Costos</h4>
                        <span class="font-black text-rose-800 text-xs">$ ${nf(totEgr)}</span>
                    </div>
                    <div class="grid grid-cols-3 gap-1">
                        ${costo('emerald', 'Personal Motorizado', totMoto, pE(totMoto))}
                        ${costo('blue', 'Nómina Administrativa', totAdmin, pE(totAdmin))}
                        ${costo('orange', 'Gastos Administrativos', totGral, pE(totGral))}
                    </div>
                </div>
            </div>
            <div class="bg-slate-50 px-3 py-1 border-t border-slate-200 flex justify-between items-center rounded-b-xl">
                <p class="text-[7px] text-slate-400 italic">* La utilidad neta se calcula antes de impuestos.</p>
                <div class="flex items-center gap-1.5">
                    <span class="text-[8px] font-bold text-slate-500 uppercase">Rentabilidad:</span>
                    <span class="text-[9px] font-black px-1.5 py-0.5 rounded border ${margen >= 0 ? 'bg-emerald-100 text-emerald-600 border-emerald-200' : 'bg-rose-100 text-rose-600 border-rose-200'}">${margen}%</span>
                </div>
            </div>
        </div>
    </div></div>`;
}

h += '</div>';
document.getElementById('raiz').innerHTML = h;
</script>
</body>
</html>
